openapi: 3.0.3
info:
  title: Atlas Workflow API
  version: 1.0.0
  description: A compact, highly connected API designed to produce a dense knowledge graph.
servers:
  - url: https://api.atlas-workflow.example.com/v1
tags:
  - name: Auth
  - name: Users
  - name: Teams
  - name: Projects
  - name: Tasks
  - name: Comments
  - name: Files
  - name: Notifications
paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
    post:
      tags: [Users]
      operationId: createUser
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /teams:
    get:
      tags: [Teams]
      operationId: listTeams
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Team list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamList'
    post:
      tags: [Teams]
      operationId: createTeam
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
      responses:
        '201':
          description: Team created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
  /teams/{teamId}:
    get:
      tags: [Teams]
      operationId: getTeam
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: Team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
    post:
      tags: [Projects]
      operationId: createProject
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
  /projects/{projectId}:
    get:
      tags: [Projects]
      operationId: getProject
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
  /projects/{projectId}/tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Status'
      responses:
        '200':
          description: Task list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
    post:
      tags: [Tasks]
      operationId: createTask
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /projects/{projectId}/tasks/{taskId}:
    get:
      tags: [Tasks]
      operationId: getTask
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
    patch:
      tags: [Tasks]
      operationId: updateTask
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /projects/{projectId}/tasks/{taskId}/comments:
    get:
      tags: [Comments]
      operationId: listTaskComments
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task comments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentList'
    post:
      tags: [Comments]
      operationId: addTaskComment
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Comment added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
  /projects/{projectId}/tasks/{taskId}/files:
    get:
      tags: [Files]
      operationId: listTaskFiles
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileList'
    post:
      tags: [Files]
      operationId: attachTaskFile
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFileRequest'
      responses:
        '201':
          description: File attached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AdminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Status:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/TaskStatus'
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required: [id, email, name, teams]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        avatarUrl:
          type: string
          format: uri
        teams:
          type: array
          items:
            $ref: '#/components/schemas/Team'
    CreateUserRequest:
      type: object
      required: [email, name, password]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        password:
          type: string
          format: password
        teamId:
          type: string
    UserList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          type: integer
    Team:
      type: object
      required: [id, name, members, projects]
      properties:
        id:
          type: string
        name:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/User'
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        projectIds:
          type: array
          items:
            type: string
    TeamList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Team'
    Project:
      type: object
      required: [id, name, owner, team, tasks]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        owner:
          $ref: '#/components/schemas/User'
        team:
          $ref: '#/components/schemas/Team'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        settings:
          $ref: '#/components/schemas/ProjectSettings'
    CreateProjectRequest:
      type: object
      required: [name, teamId]
      properties:
        name:
          type: string
        description:
          type: string
        teamId:
          type: string
        settings:
          $ref: '#/components/schemas/ProjectSettings'
    ProjectSettings:
      type: object
      properties:
        visibility:
          type: string
          enum: [private, team, public]
        defaultAssignee:
          $ref: '#/components/schemas/User'
        defaultLabels:
          type: array
          items:
            type: string
    ProjectList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
    Task:
      type: object
      required: [id, title, status, assignee, project, comments, files]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          type: string
          enum: [low, medium, high, critical]
        assignee:
          $ref: '#/components/schemas/User'
        project:
          $ref: '#/components/schemas/Project'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        files:
          type: array
          items:
            $ref: '#/components/schemas/File'
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        priority:
          type: string
          enum: [low, medium, high, critical]
        assigneeId:
          type: string
        labels:
          type: array
          items:
            type: string
    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          type: string
          enum: [low, medium, high, critical]
        assigneeId:
          type: string
    TaskStatus:
      type: string
      enum: [backlog, todo, in_progress, review, done]
    TaskList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        total:
          type: integer
    Comment:
      type: object
      required: [id, author, task, body]
      properties:
        id:
          type: string
        body:
          type: string
        author:
          $ref: '#/components/schemas/User'
        task:
          $ref: '#/components/schemas/Task'
        mentions:
          type: array
          items:
            $ref: '#/components/schemas/User'
    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
        mentions:
          type: array
          items:
            type: string
    CommentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
    File:
      type: object
      required: [id, name, uploader, task]
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
          format: uri
        uploader:
          $ref: '#/components/schemas/User'
        task:
          $ref: '#/components/schemas/Task'
        metadata:
          $ref: '#/components/schemas/FileMetadata'
    CreateFileRequest:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
        metadata:
          $ref: '#/components/schemas/FileMetadata'
    FileMetadata:
      type: object
      properties:
        size:
          type: integer
        mimeType:
          type: string
        checksum:
          type: string
    FileList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/File'
    Label:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
    Notification:
      type: object
      required: [id, recipient, actor, task]
      properties:
        id:
          type: string
        recipient:
          $ref: '#/components/schemas/User'
        actor:
          $ref: '#/components/schemas/User'
        task:
          $ref: '#/components/schemas/Task'
        message:
          type: string
    NotificationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
